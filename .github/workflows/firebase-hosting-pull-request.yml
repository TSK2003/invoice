name: Deploy Preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBC0XCJNBvPPTCk7jRXwwyqdlQIUv1Cmpg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'invoice-88bba.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'invoice-88bba' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'invoice-88bba.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '1084310681550' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:1084310681550:web:e1c399aa95ae68358ddd9f' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-S8NK6VC8EK' }}

      - name: Deploy Preview Channel
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_88BBA }}
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools hosting:channel:deploy "$CHANNEL" --project invoice-88bba --token "$FIREBASE_TOKEN"
          elif [[ "$SERVICE_ACCOUNT" == 1//* ]]; then
            npx firebase-tools hosting:channel:deploy "$CHANNEL" --project invoice-88bba --token "$SERVICE_ACCOUNT"
          elif [ -n "$SERVICE_ACCOUNT" ]; then
            echo "$SERVICE_ACCOUNT" > ./gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=./gcp-key.json
            npx firebase-tools hosting:channel:deploy "$CHANNEL" --project invoice-88bba
          else
            echo "Error: No Firebase credentials found."
            exit 1
          fi
