name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyA_d04pjpgQbE71dG5r5mD6Li_raGSXlY8' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'invoice-ebf0e.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'invoice-ebf0e' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'invoice-ebf0e.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '12098079695' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:12098079695:web:9f203738d7964d317aa0ba' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-TT64WX6VTL' }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_EBF0E || secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_88BBA || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting with FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --project invoice-ebf0e --token "$FIREBASE_TOKEN"
          elif [[ "$SERVICE_ACCOUNT" == 1//* ]]; then
            echo "Detected CI Token in FIREBASE_SERVICE_ACCOUNT, deploying with token..."
            npx firebase-tools deploy --only hosting --project invoice-ebf0e --token "$SERVICE_ACCOUNT"
          elif [ -n "$SERVICE_ACCOUNT" ]; then
            echo "Deploying to Firebase Hosting with Google Service Account JSON..."
            echo "$SERVICE_ACCOUNT" > ./gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=./gcp-key.json
            npx firebase-tools deploy --only hosting --project invoice-ebf0e
          else
            echo "Error: No Firebase deployment credential found. Please set FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_INVOICE_EBF0E in GitHub Secrets."
            exit 1
          fi
