name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBC0XCJNBvPPTCk7jRXwwyqdlQIUv1Cmpg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'invoice-88bba.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'invoice-88bba' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'invoice-88bba.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '1084310681550' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:1084310681550:web:e1c399aa95ae68358ddd9f' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-S8NK6VC8EK' }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_88BBA }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting with FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --project invoice-88bba --token "$FIREBASE_TOKEN"
          elif [[ "$SERVICE_ACCOUNT" == 1//* ]]; then
            echo "Detected CI Token in FIREBASE_SERVICE_ACCOUNT_INVOICE_88BBA, deploying with token..."
            npx firebase-tools deploy --only hosting --project invoice-88bba --token "$SERVICE_ACCOUNT"
          elif [ -n "$SERVICE_ACCOUNT" ]; then
            echo "Deploying to Firebase Hosting with Google Service Account JSON..."
            echo "$SERVICE_ACCOUNT" > ./gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=./gcp-key.json
            npx firebase-tools deploy --only hosting --project invoice-88bba
          else
            echo "Error: No Firebase deployment credential found. Please set FIREBASE_TOKEN in GitHub Secrets."
            exit 1
          fi
